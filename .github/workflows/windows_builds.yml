name: 🏁 Windows Builds
on:
  workflow_call:
    inputs:
      game-ref:
        description: Branch/SHA of waiwaic/game to check out (empty = default branch).
        required: false
        type: string
        default: ''
    secrets:
      GAME_MODULE_DEPLOY_KEY:
        required: false
  workflow_dispatch:
    inputs:
      game-ref:
        description: Branch/SHA of waiwaic/game to check out (empty = default branch).
        required: false
        type: string
        default: ''

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    debug_symbols=no
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8

jobs:
  build-windows:
    # Windows 10 with latest image
    runs-on: windows-latest
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor, ASan)
            cache-name: windows-editor-asan
            target: editor
            # d3d12=no: the Mesa NIR prebuilt has no MSVC-ASan (.san) variant,
            # so linking with use_asan=yes + d3d12 fails with LNK1181
            # libNIR.windows.x86_64.san.lib. Headless tests don't need D3D12.
            scons-flags: >-
              windows_subsystem=console
              vsproj=yes
              vsproj_gen_only=no
              use_asan=yes
              debug_symbols=yes
              d3d12=no
              angle=no
            # .san suffix: use_asan=yes appends it to the binary name.
            bin: ./bin/godot.windows.editor.x86_64.san.exe
            compiler: msvc

          - name: Editor w/ clang-cl (target=editor, use_llvm=yes)
            cache-name: windows-editor-clang
            target: editor
            scons-flags: >-
              windows_subsystem=console
              use_llvm=yes
            bin: ./bin/godot.windows.editor.x86_64.llvm.exe
            compiler: clang

          - name: Template (target=template_release)
            cache-name: windows-template
            target: template_release
            bin: ./bin/godot.windows.template_release.x86_64.console.exe
            compiler: msvc

          - name: Template w/ GCC (target=template_release, use_mingw=yes)
            cache-name: windows-template-gcc
            # MinGW takes MUCH longer to compile; save time by only targeting Template.
            target: template_release
            scons-flags: use_mingw=yes
            bin: ./bin/godot.windows.template_release.x86_64.console.exe
            compiler: gcc
    env:
      GAME_MODULE_DEPLOY_KEY: ${{ secrets.GAME_MODULE_DEPLOY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clone private module repository
        if: env.GAME_MODULE_DEPLOY_KEY != ''
        uses: actions/checkout@v7
        with:
          repository: waiwaic/game
          ref: ${{ inputs.game-ref }}
          ssh-key: ${{ env.GAME_MODULE_DEPLOY_KEY }}
          path: modules/game
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        # ASan builds must skip D3D12: the Mesa NIR prebuilt has no MSVC-ASan
        # (.san) variant, so linking fails with LNK1181. Matrix jobs that set
        # d3d12=no in their scons-flags force this step to report "no".
        run: |
          if echo "${{ matrix.scons-flags }}" | grep -q "d3d12=no"; then
            echo "D3D12_ENABLED=no (forced by matrix: ASan has no NIR .san prebuilt)"
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          elif python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        # Same .san-variant limitation as D3D12/NIR above: skip when the
        # matrix job forces angle=no (ASan has no libANGLE .san prebuilt).
        run: |
          if echo "${{ matrix.scons-flags }}" | grep -q "angle=no"; then
            echo "ANGLE_ENABLED=no"
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          elif python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download WinRT components
        shell: sh
        run: python ./misc/scripts/install_winrt.py
        continue-on-error: true

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Prepare artifact
        if: matrix.compiler == 'msvc'
        run: |
          Remove-Item bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload artifact
        if: matrix.compiler == 'msvc'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      # MSVC ASan executables cannot RUN on GitHub runners: the ASan dynamic
      # runtime fails interceptor initialization during process attach
      # (actions/runner-images#8891, InterceptionFailed, exit 1 with no
      # output). The build still validates MSVC compilation of the module;
      # runtime e2e coverage for this crash is provided by the clang-cl and
      # MinGW jobs plus Linux sanitizers.
      - name: Unit tests
        if: matrix.cache-name != 'windows-editor-asan'
        env:
          ASAN_OPTIONS: ${{ matrix.env-extra }}
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          ${{ matrix.bin }} --headless --test -s --force-colors ${{ matrix.test-filter }} "-tc=*MapPipelineE2E*"
