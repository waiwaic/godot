name: 🍏 iOS Builds
on:
  workflow_call:
    inputs:
      game-ref:
        description: Branch/SHA of waiwaic/game to check out (empty = default branch).
        required: false
        type: string
        default: ''
    secrets:
      GAME_MODULE_DEPLOY_KEY:
        required: false
  workflow_dispatch:
    inputs:
      game-ref:
        description: Branch/SHA of waiwaic/game to check out (empty = default branch).
        required: false
        type: string
        default: ''

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    debug_symbols=no

jobs:
  ios-template:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-26
    name: Template (target=template_release)
    timeout-minutes: 60
    env:
      GAME_MODULE_DEPLOY_KEY: ${{ secrets.GAME_MODULE_DEPLOY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clone private module repository
        if: env.GAME_MODULE_DEPLOY_KEY != ''
        uses: actions/checkout@v7
        with:
          repository: waiwaic/game
          ref: ${{ inputs.game-ref }}
          ssh-key: ${{ env.GAME_MODULE_DEPLOY_KEY }}
          path: modules/game
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }}
          platform: ios
          target: template_release

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
