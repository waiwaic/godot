name: 🐧 Linux Builds
on:
  workflow_call:
    inputs:
      game-ref:
        description: Branch/SHA of waiwaic/game to check out (empty = default branch).
        required: false
        type: string
        default: ''
      changed-files:
        description: A list of changed files, pre-filtered for parsing by clangd-tidy.
        required: true
        type: string
    secrets:
      GAME_MODULE_DEPLOY_KEY:
        required: false
  workflow_dispatch:
    inputs:
      game-ref:
        description: Branch/SHA of waiwaic/game to check out (empty = default branch).
        required: false
        type: string
        default: ''
      changed-files:
        description: Optional list of changed files for clangd-tidy. Leave empty to skip the style check when dispatching this workflow directly.
        required: false
        type: string
        default: ''

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
  GODOT_CPP_BRANCH: 4.5
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/asan.txt:handle_abort=1:print_stacktrace=1
  LSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/lsan.txt
  TSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/tsan.txt:handle_abort=1:print_stacktrace=1
  UBSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/ubsan.txt:handle_abort=1:print_stacktrace=1

jobs:
  build-linux:
    # Stay one LTS before latest to increase portability of Linux artifacts.
    runs-on: ubuntu-22.04
    name: ${{ matrix.name }}
    # Normal jobs finish in <= 35 min with a warm cache; anything longer means
    # the test binary hung (see Unit tests step for the per-step guard).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor w/ Mono (target=editor)
            cache-name: linux-editor-mono
            target: editor
            scons-flags: module_mono_enabled=yes compiledb=yes
            bin: ./bin/godot.linuxbsd.editor.x86_64.mono
            build-mono: true
            doc-test: true
            proj-conv: true
            proj-export: true
            api-compat: true
            artifact: true
            # Validate godot-cpp compatibility on one arbitrary editor build.
            godot-cpp: true
            clangd-tidy: true

          - name: Editor with doubles and GCC sanitizers (target=editor, dev_build=yes, scu_build=yes, precision=double, use_asan=yes, use_ubsan=yes, use_llvm=yes, linker=lld)
            cache-name: linux-editor-double-sanitizers
            target: editor
            # Debug symbols disabled as they're huge on this build and we hit the 14 GB limit for runners.
            # use_llvm=yes + linker=lld (not gcc+mold): the ASan+double+SCU
            # binary exceeds mold's PC32 relocation range, and gcc can't find
            # the runner's version-suffixed ld.lld-13. The clang driver locates
            # lld itself, so use the clang toolchain here.
            scons-flags: >-
              dev_build=yes
              scu_build=yes
              debug_symbols=no
              precision=double
              use_llvm=yes
              use_asan=yes
              use_ubsan=yes
              linker=lld
            # .llvm suffix: use_llvm=yes appends it to the binary name.
            bin: ./bin/godot.linuxbsd.editor.dev.double.x86_64.llvm.san
            # Upstream godotengine CI runs the full suite green daily; here we
            # only run the game module cases, minus the [SceneTree]
            # integration cases: sanitizer instrumentation slows the frame
            # loops so much that the whole scoped suite exceeds any sane step
            # timeout. Those cases stay covered by the plain Game module job.
            test-filter: "-tc=*Modules*Gameplay* -tce=*[SceneTree]*"
            # proj-test is intentionally NOT enabled here (it was until
            # 2026-08-28): godotengine/regression-test-project's
            # AutomaticBugs/FunctionExecutor.gd enumerates every ClassDB class
            # and calls each of its methods with sentinel arguments (100, -1,
            # empty strings...). Upstream never sees the game module's 438
            # classes, but with custom_modules=game they are enumerated too,
            # and their index getters (e.g. CrystalSphereMinigame::get_item)
            # hit CowData::get's CRASH_BAD_INDEX under dev_build, aborting the
            # binary with signal 4 (__ubsan_handle_function_type_mismatch).
            # That is a private-module robustness issue, not an engine
            # regression, so it must not gate this job. The regression project
            # stays covered by the jobs that build the engine without the
            # game module.
            free-space: true

          # MSan job disabled: with libstdc++ (uninstrumented), every STL
          # access reports use-of-uninitialized-value (6800+ false positives
          # in doctest setup alone). Proper MSan requires -stdlib=libc++
          # plus an MSan-instrumented libc++ to produce meaningful results.
          # - name: Editor with clang MSan (target=editor, dev_build=yes, use_msan=yes, use_llvm=yes, linker=lld)
          #   cache-name: linux-editor-llvm-msan
          #   target: editor
          #   scons-flags: >-
          #     dev_build=yes
          #     use_msan=yes
          #     use_llvm=yes
          #     linker=lld
          #   bin: ./bin/godot.linuxbsd.editor.dev.x86_64.llvm.san
          #   test-filter: "-tc=*MapPipelineE2E*"

          - name: Editor with ThreadSanitizer (target=editor, dev_build=yes, use_tsan=yes, use_llvm=yes, linker=lld)
            cache-name: linux-editor-thread-sanitizer
            target: editor
            scons-flags: >-
              dev_build=yes
              use_tsan=yes
              use_llvm=yes
              linker=lld
            bin: ./bin/godot.linuxbsd.editor.dev.x86_64.llvm.san
            # Upstream godotengine CI runs the full suite green daily; here we
            # only run the game module cases, minus the [SceneTree]
            # integration cases: sanitizer instrumentation slows the frame
            # loops so much that the whole scoped suite exceeds any sane step
            # timeout. Those cases stay covered by the plain Game module job.
            test-filter: "-tc=*Modules*Gameplay* -tce=*[SceneTree]*"
            free-space: true

          - name: Template w/ Mono, release (target=template_release)
            cache-name: linux-template-mono
            target: template_release
            scons-flags: module_mono_enabled=yes
            bin: ./bin/godot.linuxbsd.template_release.x86_64.mono
            artifact: true

          - name: Template w/ Mono, debug (target=template_debug)
            cache-name: linux-template-mono-debug
            target: template_debug
            scons-flags: module_mono_enabled=yes
            bin: ./bin/godot.linuxbsd.template_debug.x86_64.mono
            artifact: true

          - name: Minimal template (target=template_release, everything disabled)
            cache-name: linux-template-minimal
            target: template_release
            scons-flags: >-
              modules_enabled_by_default=no
              module_text_server_fb_enabled=no
              disable_3d=yes
              disable_advanced_gui=yes
              disable_physics_2d=yes
              disable_physics_3d=yes
              deprecated=no
              minizip=no
              brotli=no
            bin: ./bin/godot.linuxbsd.template_release.x86_64
            artifact: true
    env:
      GAME_MODULE_DEPLOY_KEY: ${{ secrets.GAME_MODULE_DEPLOY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clone private module repository
        if: env.GAME_MODULE_DEPLOY_KEY != ''
        uses: actions/checkout@v7
        with:
          repository: waiwaic/game
          ref: ${{ inputs.game-ref }}
          ssh-key: ${{ env.GAME_MODULE_DEPLOY_KEY }}
          path: modules/game
          submodules: recursive

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libwayland-bin  # TODO: Figure out somehow how to embed this one.
          if [ "${{ matrix.proj-test }}" == "true" -o "${{ matrix.proj-export }}" == "true" ]; then
            sudo apt-get install mesa-vulkan-drivers
          fi

      - name: Free disk space on runner
        if: matrix.free-space
        run: |
          echo "Disk usage before:" && df -h
          sudo rm -rf /usr/local/lib/android
          echo "Disk usage after:" && df -h

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        if: "!matrix.legacy-scons"
        uses: ./.github/actions/godot-deps

      - name: Setup Python and SCons (legacy versions)
        if: matrix.legacy-scons
        uses: ./.github/actions/godot-deps
        with:
          # Sync with Ensure*Version in SConstruct.
          python-version: 3.9
          scons-version: 4.4

      - name: Force remove preinstalled .NET SDKs
        if: matrix.build-mono
        run: |
          sudo rm -rf /usr/share/dotnet/sdk/*

      - name: Setup older .NET SDK as baseline
        if: matrix.build-mono
        uses: actions/setup-dotnet@v5
        with:
          # Targeting the oldest version we want to support to ensure it still builds.
          dotnet-version: 8.0.100

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mold linker
        if: matrix.proj-test
        uses: rui314/setup-mold@v1

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
          platform: linuxbsd
          target: ${{ matrix.target }}

      - name: Style checks via clangd-tidy
        if: matrix.clangd-tidy && inputs.changed-files != ''
        uses: ./.github/actions/clangd-tidy
        with:
          changed-files: ${{ inputs.changed-files }}

      - name: Compilation (godot-cpp)
        uses: ./.github/actions/godot-cpp-build
        if: matrix.godot-cpp
        with:
          bin: ${{ matrix.bin }}
          scons-flags: target=template_debug dev_build=yes verbose=yes
          godot-cpp-branch: ${{ env.GODOT_CPP_BRANCH }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Generate C# glue
        if: matrix.build-mono
        run: |
          ${{ matrix.bin }} --headless --generate-mono-glue ./modules/mono/glue

      - name: Build .NET solutions
        if: matrix.build-mono
        run: |
          dotnet --info
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=linuxbsd --werror

      - name: Prepare artifact
        if: matrix.artifact
        run: |
          rm -rf ./bin/build_deps
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        if: matrix.artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Unit tests
        # `timeout -s ABRT` kills a hung test binary with SIGABRT so the
        # sanitizer runtime (handle_abort=1) dumps all thread stacks into the
        # log before the step dies -- without this a hang produced zero output
        # and burned the whole job timeout.
        # Step cap 44 min must exceed that guard (30 min into the test run)
        # with margin for --version/--help + compile-free startup, yet stay
        # under the 45 min job cap; it also bounds the full-suite Mono jobs.
        timeout-minutes: 44
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          # 1800s: the scoped game suite takes ~18 min under sanitizer
          # instrumentation on a warm cache and was ABRT-killed mid-suite at
          # 19 min once on a colder one (2026-08-26); 900s killed it right as
          # the summary printed. The step cap above absorbs the difference.
          timeout -s ABRT 1800 ${{ matrix.bin }} --headless --test --force-colors ${{ matrix.test-filter }}

      - name: .NET source generators tests
        if: matrix.build-mono
        run: |
          dotnet test modules/mono/editor/Godot.NET.Sdk/Godot.SourceGenerators.Tests

      # Check class reference
      - name: Check for class reference updates
        if: matrix.doc-test
        run: |
          echo "Running --doctool to see if this changes the public API without updating the documentation."
          echo -e "If a diff is shown, it means that your code/doc changes are incomplete and you should update the class reference with --doctool.\n\n"
          ${{ matrix.bin }} --doctool --headless 2>&1 > /dev/null || true
          git diff --color --exit-code && ! git ls-files --others --exclude-standard | sed -e 's/^/New doc file missing in PR: /' | grep 'xml$'

      # Check API backwards compatibility
      - name: Check for GDExtension compatibility – JSON check
        if: matrix.api-compat
        run: |
          ./misc/scripts/validate_extension_api.sh "${{ matrix.bin }}"

      - name: Test GDExtension compatibility – load methods
        uses: ./.github/actions/godot-compat-test
        if: matrix.api-compat
        with:
          bin: ${{ matrix.bin }}
          reftags: "4.5-stable,4.4-stable"

      # Download and run the test project
      - name: Test Godot project
        uses: ./.github/actions/godot-project-test
        if: matrix.proj-test
        with:
          bin: ${{ matrix.bin }}

      # Test project export
      - name: Test project export
        uses: ./.github/actions/godot-project-export
        if: matrix.proj-export
        with:
          bin: ${{ matrix.bin }}

      # Test the project converter
      - name: Test project converter
        uses: ./.github/actions/godot-converter-test
        if: matrix.proj-conv
        with:
          bin: ${{ matrix.bin }}
