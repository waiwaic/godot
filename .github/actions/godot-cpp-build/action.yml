name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: |
        ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api
        # The scons invocation runs from the short symlink path (/tmp/gp), so
        # relative lookups for these files resolve inside godot-cpp. Provide
        # them there too.
        cp extension_api.json gdextension_interface.h godot-cpp/
        cp extension_api.json godot-cpp/extension_api-4.7.json

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      # The full godot-cpp test build links libgodot-cpp.a from ~1500 objects.
      # With our module's classes the ar command line exceeds MAX_ARG_STRLEN
      # (131072) and fails with "Argument list too long" (godot-cpp#1729,
      # fix PR #1731 still unmerged). A root-level symlink shortens every
      # object path by ~40 chars, bringing the argv total back under the
      # limit while keeping the full build (and thus full compatibility
      # validation) intact.
      run: |
        # / is not writable on runners; /tmp is. A short checkout path shortens
        # every object path in the ar argv below MAX_ARG_STRLEN.
        mkdir -p /tmp/gc
        ln -sfn "$PWD/godot-cpp" /tmp/gp
        scons --directory=/tmp/gp/test "gdextension_dir=/tmp/gp" ${{ inputs.scons-flags }}
