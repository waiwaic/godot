name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    - name: Compile bindings for module classes (compat check)
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      # Full godot-cpp test build links libgodot-cpp.a from ~1500 gen objects;
      # with the game module's registered classes the ar argv exceeds
      # MAX_ARG_STRLEN and fails with "Argument list too long" (godot-cpp#1729,
      # upstream fix PR #1731 unmerged). The compat property this job must
      # verify is that binding_generator emits valid, compilable C++ for OUR
      # classes — so generate all bindings, then compile only the generated
      # TUs for game-registered classes plus one core TU. scons builds exactly
      # the requested targets (plus the generation step they depend on).
      run: |
        TARGETS=$(python3 - <<'EOF'
        import json, re, subprocess
        r = subprocess.run(["grep", "-rho", r"GDCLASS(\w*",
                            "modules/game/football/entities",
                            "modules/game/map/entities"], capture_output=True, text=True)
        names = sorted({x.split("(")[1] for x in r.stdout.splitlines() if "(" in x})
        api = json.load(open("extension_api.json"))
        def snake(name):
            return re.sub(r'(?<!^)(?=[A-Z])', '_', name).lower()
        targets = []
        for c in api["classes"]:
            if c["name"] in names:
                low = snake(c["name"])
                targets.append("gen/src/classes/%s.linux.template_debug.dev.x86_64.o" % low)
        print(" ".join(sorted(set(targets))))
        EOF
        )
        echo "targets: $TARGETS"
        scons --directory=./godot-cpp "gdextension_dir=${{ github.workspace }}" \
          ${{ inputs.scons-flags }} platform=linux target=template_debug dev_build=yes \
          $TARGETS
